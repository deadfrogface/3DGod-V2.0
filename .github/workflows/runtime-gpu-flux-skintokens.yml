name: GPU FLUX / SkinTokens Runtime

# Prepared for later CUDA proof. Does NOT silently introduce paid GitHub GPU larger runners
# (Team/Enterprise billing + org larger-runner setup required). Target self-hosted labels instead.
# PASS_REAL only when real CUDA inference writes PNG/GLB — never soft-pass.

on:
  workflow_dispatch:
    inputs:
      run_flux:
        description: "Run FLUX.1-schnell live PNG proof"
        type: boolean
        default: true
      run_skintokens:
        description: "Run SkinTokens live rig proof (>=14GB VRAM)"
        type: boolean
        default: false
      run_flux_triposr:
        description: "Run FLUX→TripoSR E2E when both ready"
        type: boolean
        default: false

concurrency:
  group: gpu-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  flux-skintokens-gpu:
    name: FLUX / SkinTokens CUDA Proof
    # Exact label contract — see scripts/ops/Prepare-SelfHostedRunnerLabels.ps1 -Profile gpu
    runs-on: [self-hosted, windows, gpu, cuda]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Probe NVIDIA / CUDA
        shell: pwsh
        run: |
          $nvsmi = Get-Command nvidia-smi -ErrorAction SilentlyContinue
          if (-not $nvsmi) {
            Write-Host "::error::GATED_HARDWARE – nvidia-smi missing on labeled gpu runner"
            exit 2
          }
          & nvidia-smi
          Write-Host "CUDA_PROBE=OK"

      - name: Install uv
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -c "irm https://astral.sh/uv/install.ps1 | iex"
          $uvBin = Join-Path $env:USERPROFILE ".local\bin"
          echo $uvBin >> $env:GITHUB_PATH

      - name: Sync FLUX worker (when requested)
        if: ${{ inputs.run_flux || inputs.run_flux_triposr }}
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          uv sync --project workers/flux --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sync SkinTokens worker (when requested)
        if: ${{ inputs.run_skintokens }}
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          uv sync --project workers/skintokens --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sync TripoSR worker (FLUX→TripoSR E2E)
        if: ${{ inputs.run_flux_triposr }}
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          uv sync --project workers/triposr --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build tests
        shell: pwsh
        run: dotnet build "3DGodCreator.Core.Tests/3DGodCreator.Core.Tests.csproj" -c Release -v minimal

      - name: FLUX live PNG
        if: ${{ inputs.run_flux }}
        shell: pwsh
        env:
          THREEDGOD_CI_ARTIFACT_DIR: artifacts/runtime
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          New-Item -ItemType Directory -Force -Path "artifacts/runtime/flux" | Out-Null
          # SkippableFact: if weights/CUDA missing → SKIPPED_ENVIRONMENT (job fails if env claimed ready but inference fails)
          dotnet test "3DGodCreator.Core.Tests/3DGodCreator.Core.Tests.csproj" -c Release --no-build `
            --filter "FullyQualifiedName~FluxLiveTests.Generate_WhenReady_WritesRealPng_WithValidDimensions" `
            --logger "trx;LogFileName=flux.trx" `
            --logger "console;verbosity=normal" `
            --results-directory "artifacts/runtime"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::FLUX live proof FAILED"
            exit $LASTEXITCODE
          }
          # Copy any PNGs produced under temp into artifacts if present
          Get-ChildItem $env:TEMP -Filter "3dgod-flux-live-*" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName (Join-Path "artifacts/runtime/flux" $_.Name) -Recurse -Force -ErrorAction SilentlyContinue }

      - name: FLUX → TripoSR E2E
        if: ${{ inputs.run_flux_triposr }}
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          New-Item -ItemType Directory -Force -Path "artifacts/runtime/flux-triposr" | Out-Null
          dotnet test "3DGodCreator.Core.Tests/3DGodCreator.Core.Tests.csproj" -c Release --no-build `
            --filter "FullyQualifiedName~FluxLiveTests.FluxThenTripoSr_WhenBothReady_WritesRealGlb" `
            --logger "trx;LogFileName=flux-triposr.trx" `
            --logger "console;verbosity=normal" `
            --results-directory "artifacts/runtime"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::FLUX→TripoSR E2E FAILED"
            exit $LASTEXITCODE
          }

      - name: SkinTokens honesty (no fake PASS_REAL without inference)
        if: ${{ inputs.run_skintokens }}
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          # Live SkinTokens inference requires checkpoints + upstream + >=14GB VRAM.
          # Existing SkinTokensTests assert honest NotInstalled/UnsupportedHardware; never claim PASS_REAL here without a real rig GLB.
          dotnet test "3DGodCreator.Core.Tests/3DGodCreator.Core.Tests.csproj" -c Release --no-build `
            --filter "FullyQualifiedName~SkinTokensTests" `
            --logger "trx;LogFileName=skintokens.trx" `
            --logger "console;verbosity=normal" `
            --results-directory "artifacts/runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "SKINTOKENS_NOTE=PASS_REAL only after real CUDA rig GLB; otherwise GATED_HARDWARE / NotInstalled"

      - name: Upload GPU runtime artifacts (PNG/GLB/logs — not model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-flux-skintokens-runtime
          path: |
            artifacts/runtime/
            !**/*.safetensors
            !**/*.ckpt
            !**/*.bin
            !**/*.gguf
          if-no-files-found: warn
          retention-days: 14
