name: TripoSR CPU Online Proof

# Heavy (~1.6GB MIT checkpoint + slow CPU inference). Not on every PR by default.
# Manual / weekly schedule / main push optional. Never fakes GLB; never uploads the checkpoint.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly Monday 04:17 UTC
  pull_request:
    paths:
      - "workers/triposr/**"
      - "src/ThreeDGod.Workers/TripoSrService.cs"
      - "src/ThreeDGod.Infrastructure/TripoSrModelAcquire.cs"
      - "3DGodCreator.Core.Tests/CiOnlineRuntimeProofTests.cs"
      - "3DGodCreator.Core.Tests/TripoSrLiveTests.cs"
      - ".github/workflows/runtime-triposr-cpu.yml"
  push:
    branches: [main]
    paths:
      - "workers/triposr/**"
      - "src/ThreeDGod.Workers/TripoSrService.cs"
      - "src/ThreeDGod.Infrastructure/TripoSrModelAcquire.cs"
      - "3DGodCreator.Core.Tests/CiOnlineRuntimeProofTests.cs"
      - "3DGodCreator.Core.Tests/TripoSrLiveTests.cs"
      - ".github/workflows/runtime-triposr-cpu.yml"

concurrency:
  group: triposr-cpu-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  triposr-cpu:
    name: TripoSR CPU PASS_REAL
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install uv
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -c "irm https://astral.sh/uv/install.ps1 | iex"
          $uvBin = Join-Path $env:USERPROFILE ".local\bin"
          echo $uvBin >> $env:GITHUB_PATH
          & "$uvBin\uv.exe" --version

      - name: Cache TripoSR checkpoint
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/3dgod-triposr-cache
          key: triposr-ckpt-429e2c6b22a0923967459de24d67f05962b235f79cde6b032aa7ed2ffcd970ee

      - name: Acquire MIT checkpoint (SHA-256 pinned)
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "3dgod-triposr-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          & "scripts/ci/Invoke-AcquireTripoSrCheckpoint.ps1" -ModelDir $cache -SkipIfPresent
          $dest = Join-Path $env:LOCALAPPDATA "3DGod\Models\triposr"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $cache "model.ckpt") $dest -Force
          Copy-Item (Join-Path $cache "config.yaml") $dest -Force

      - name: Sync TripoSR worker (CPU)
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          uv sync --project workers/triposr --frozen
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::TripoSR uv sync failed"
            exit $LASTEXITCODE
          }

      - name: Build + run TripoSR live generate
        id: tripo
        shell: pwsh
        env:
          THREEDGOD_CI_RUNTIME_INTEGRATION: "1"
          THREEDGOD_CI_TRIPOSR: "1"
          # Absolute path so artifacts land at repo-root upload location even if
          # the test host CWD is under bin/Release (see docs/audit/TRIPOSR_CI_FAILURE_ANALYSIS.md).
          THREEDGOD_CI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/runtime
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          $art = Join-Path $env:GITHUB_WORKSPACE "artifacts/runtime/triposr"
          New-Item -ItemType Directory -Force -Path $art | Out-Null
          dotnet build "3DGodCreator.Core.Tests/3DGodCreator.Core.Tests.csproj" -c Release -v minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test "3DGodCreator.Core.Tests/3DGodCreator.Core.Tests.csproj" -c Release --no-build `
            --filter "FullyQualifiedName~CiOnlineRuntimeProofTests.TripoSr_CpuGenerate_WritesValidatedGlb" `
            --logger "trx;LogFileName=triposr.trx" `
            --logger "console;verbosity=normal" `
            --results-directory "artifacts/runtime"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::TripoSR CPU proof FAILED – not soft-skipped"
            exit $LASTEXITCODE
          }
          $glb = Join-Path $art "chair-cpu.glb"
          if (-not (Test-Path -LiteralPath $glb)) {
            Write-Host "::error::Expected TripoSR artifact missing: $glb"
            exit 1
          }
          Write-Host "TRIPOSR_RUNTIME=PASS_REAL bytes=$((Get-Item -LiteralPath $glb).Length)"

      - name: Upload TripoSR GLB + logs (not the checkpoint)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triposr-cpu-runtime
          path: |
            artifacts/runtime/triposr/
            artifacts/runtime/*.trx
          if-no-files-found: warn
          retention-days: 14
