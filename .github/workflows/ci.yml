name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (Windows / .NET 10)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show SDK
        shell: pwsh
        run: |
          dotnet --info
          Get-Content global.json

      - name: Restore
        shell: pwsh
        run: dotnet restore "3DGodCreator.sln"

      - name: Build Release
        id: build
        shell: pwsh
        run: |
          dotnet build "3DGodCreator.sln" -c Release --no-restore -v minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Release build FAILED"
            exit $LASTEXITCODE
          }
          Write-Host "BUILD_STATUS=SUCCESS"

      - name: Test Release
        id: test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/test" | Out-Null
          dotnet test "3DGodCreator.Core.Tests/3DGodCreator.Core.Tests.csproj" `
            -c Release `
            --no-build `
            --logger "trx;LogFileName=results.trx" `
            --logger "console;verbosity=normal" `
            --results-directory "artifacts/test"
          $code = $LASTEXITCODE
          $trx = Get-ChildItem -Path "artifacts/test" -Filter "results.trx" -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $trx) {
            Write-Host "::error::No results.trx produced under artifacts/test"
            exit 2
          }
          Write-Host "Using TRX: $trx"
          & "scripts/ci/Summarize-TestResults.ps1" -TrxPath $trx -FailOnTestFailures
          if ($code -ne 0) { exit $code }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test/
          if-no-files-found: warn
